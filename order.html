<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อ - The Moon Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">THE MOON</a>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="product.html">เมนูเครื่องดื่ม</a>
      <a href="order.html">สั่งซื้อ/จองโต๊ะ</a>
    </nav>
  </header>

  <div class="container">
    <h1 style="text-align: center; font-family: var(--font-serif); color: var(--accent-gold); margin-bottom: 2rem;">PRE-ORDER & RESERVATION</h1>

    <form id="orderForm">
      <div class="form-group">
        <label for="customerName">ชื่อลูกค้า</label>
        <input type="text" id="customerName" required placeholder="กรอกชื่อของคุณ">
      </div>
      <div class="form-group">
        <label for="contact">เบอร์โทรศัพท์ / Line ID</label>
        <input type="text" id="contact" required placeholder="ช่องทางการติดต่อกลับ">
      </div>
      <div class="form-group">
        <label for="items">รายการเมนูที่สั่ง</label>
        <input type="text" id="items" required placeholder="ระบุรายการเมนู">
      </div>
      <div class="form-group">
        <label for="total">จำนวนเงินรวม (บาท)</label>
        <input type="number" id="total" required placeholder="0.00">
      </div>
      <div class="form-group">
        <label for="note">หมายเหตุเพิ่มเติม</label>
        <textarea id="note" rows="3" placeholder="ระบุความหวาน หรือข้อความเพิ่มเติม"></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%;">ยืนยันการสั่งซื้อ</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 The Moon Cafe. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
